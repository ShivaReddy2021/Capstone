name: Deploy site to GitHub Pages

on:
  push:
    # deploy when main, feature, or release branches are pushed
    branches: [ main, 'feature_*', 'feature/**', 'release_*', 'release/**', 'release/*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy (example: feature_02/09.26 or main)'
        required: false
        default: 'main'

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Quick CI checks
    outputs:
      docs-exists: ${{ steps.check_docs.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        id: check_docs
        run: |
          if [ -f ./docs/index.html ]; then echo "exists=true"; else echo "exists=false"; fi
          if [ "$(cat ./docs/index.html 2>/dev/null | head -n1 | grep -i '<!doctype' || true)" = "" ]; then echo "doctype_missing=true"; else echo "doctype_missing=false"; fi

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    name: Upload and deploy docs/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # when manually dispatched, allow selecting a different ref
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
