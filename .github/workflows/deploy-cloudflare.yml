name: Deploy to Cloudflare Pages

on:
  push:
    # deploy when main, feature, or release branches are pushed
    branches: [ main, 'feature_*', 'feature/**', 'release_*', 'release/**', 'release/*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy (example: feature_02/09.26 or main)'
        required: false
        default: 'main'

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Quick CI checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ -f ./docs/index.html ]; then echo "docs exists"; else echo "docs/index.html not found"; exit 1; fi

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    name: Deploy docs to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: ./docs
